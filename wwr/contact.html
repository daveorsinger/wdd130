<section class="contact-info">

<div class="contact-details">
<div>

<p>Email: info@rapidriverrafting.com</p>
</div>

<iframe
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d49911.02356903027!2d-109.58869017630943!3d38.569737937685495!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8747e1e59ab82d8d%3A0xb32b17af1d5c42d!2sMoab%2C%20UT%2084532!5e0!3m2!1sen!2sus!4v1791135863496!5m2!1sen!2sus"

<section class="employees">
<h2>Meet Our Team</h2>

<div class="employee-grid">
<figure>
<img src="images/employee1.jpg" alt="Rapid River Rafting manager">
<figcaption>John Snow - River Manager</figcaption>
</figure>

<figure>
<img src="images/employee2.jpg" alt="Rapid River Rafting guide">
<figcaption>Sarah Whittier - Head River Guide</figcaption>
</figure>

<figure>
<img src="images/employee3.jpg" alt="Rapid River Rafting reservations employee">
<figcaption>Mike Shirley - Reservations</figcaption>
</figure>
</div>
</section>

<section class="contact-form">
<h2>Send Us a Message</h2>

<form>
<label for="name">Name:</label>
<input type="text" id="name" name="name">

<label for="email">Email:</label>
<input type="email" id="email" name="email">

<fieldset>
<legend>Purpose of Message</legend>

<label>
<input type="radio" name="purpose" value="general">
General Inquiry
</label>

<label>
<input type="radio" name="purpose" value="reservation">
Reservation Question
</label>

<label>
<input type="radio" name="purpose" value="website">
 Website Suggestion
</label>
</fieldset>

<label for="message">Message:</label>
<textarea id="message" name="message" rows="6"></textarea>

<label>
<input type="checkbox" name="newsletter">
Please subscribe me to the monthly newsletter
</label>

<button type="submit">Send Message</button>
</form>
</section>

</main>
